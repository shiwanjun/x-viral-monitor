<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-Tools 书签工作台</title>
  <style>
    :root { --bg:#f6f7fb; --paper:#fff; --ink:#151823; --muted:#73798a; --line:#e7e9f0; --violet:#7058ed; --violet-soft:#f0edff; --green:#159960; --orange:#d16a29; --shadow:0 12px 35px rgba(30,34,51,.06); }
    * { box-sizing:border-box; } body { margin:0; min-width:1060px; color:var(--ink); background:var(--bg); font:14px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } .app { display:grid; grid-template-columns:246px minmax(0,1fr); min-height:100vh; }
    .sidebar { position:sticky; top:0; display:flex; flex-direction:column; height:100vh; padding:19px 14px 15px; border-right:1px solid var(--line); background:#fff; }
    .brand { display:flex; align-items:center; gap:10px; padding:0 7px 25px; color:var(--ink); font-size:19px; font-weight:820; letter-spacing:-.04em; text-decoration:none; } .brand img { width:30px; height:30px; border-radius:9px; object-fit:cover; }
    .side-label { padding:0 8px 8px; color:#9ca2b0; font-size:11px; font-weight:800; letter-spacing:.08em; } .nav { display:grid; gap:3px; } .nav-item { display:flex; align-items:center; gap:11px; width:100%; padding:10px 11px; border:0; border-radius:9px; color:#555b6b; background:transparent; text-align:left; font-weight:650; } .nav-item:hover { background:#f4f3f8; } .nav-item.active { color:#4a34c6; background:var(--violet-soft); } .nav-icon { width:18px; color:currentColor; text-align:center; font-size:17px; }
    .folders { margin-top:28px; } .folder-head { display:flex; align-items:center; justify-content:space-between; padding:0 8px 8px; color:#9ca2b0; font-size:11px; font-weight:800; letter-spacing:.08em; } .folder-list { display:grid; gap:2px; max-height:360px; overflow:auto; } .folder-item { display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:0; border-radius:8px; color:#555b6b; background:transparent; text-align:left; } .folder-item:hover,.folder-item.active { background:#f4f3f8; color:#3824aa; } .folder-item strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; } .folder-item small { margin-left:auto; color:#9298a7; }
    .profile { display:flex; align-items:center; gap:9px; margin-top:auto; padding:11px 8px 1px; border-top:1px solid var(--line); } .avatar { display:grid; flex:0 0 auto; place-items:center; width:31px; height:31px; overflow:hidden; border-radius:50%; color:#fff; background:linear-gradient(135deg,#8066ff,#352787); font-size:12px; font-weight:800; } .avatar img { width:100%; height:100%; object-fit:cover; } .profile-copy { min-width:0; } .profile strong,.profile small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .profile strong { font-size:12px; } .profile small { color:#9096a6; font-size:11px; }
    .content { min-width:0; } .top { display:flex; align-items:center; min-height:72px; padding:0 30px; border-bottom:1px solid var(--line); background:#fff; } .tabs { display:flex; align-self:stretch; gap:22px; } .tab { position:relative; display:flex; align-items:center; gap:8px; border:0; color:#767d8e; background:transparent; font-weight:750; } .tab.active { color:var(--ink); } .tab.active::after { position:absolute; right:0; bottom:0; left:0; height:3px; border-radius:3px 3px 0 0; background:var(--violet); content:""; } .count { min-width:34px; padding:2px 8px; border-radius:999px; color:#4b5162; background:#f0f1f5; text-align:center; font-size:12px; } .tab.active .count { color:#fff; background:#272931; } .top-tools { display:flex; align-items:center; gap:11px; margin-left:auto; } .search { display:flex; align-items:center; gap:8px; width:min(365px,30vw); padding:0 11px; border:1px solid #d8dbe5; border-radius:9px; background:#fff; color:#9298a8; } .search:focus-within { border-color:#8b78ef; box-shadow:0 0 0 3px #7058ed18; } .search input { width:100%; height:37px; border:0; outline:0; color:var(--ink); background:transparent; } .search input::placeholder { color:#a7acba; } .member { padding:6px 9px; border:1px solid #c5ebd6; border-radius:99px; color:#167345; background:#effbf4; font-size:12px; font-weight:750; }
    .main { padding:26px 30px 34px; } .headline { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; } .headline h1 { margin:0; font-size:23px; letter-spacing:-.04em; } .headline p { margin:5px 0 0; color:var(--muted); font-size:13px; } .sync-state { display:flex; align-items:center; gap:7px; color:#707789; font-size:12px; } .sync-dot { width:7px; height:7px; border-radius:50%; background:#b3bac7; } .sync-state.ready .sync-dot { background:var(--green); box-shadow:0 0 0 3px #15996017; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; } .summary-card { padding:15px 16px; border:1px solid var(--line); border-radius:12px; background:var(--paper); box-shadow:var(--shadow); } .summary-card span { display:block; color:#818899; font-size:12px; } .summary-card strong { display:block; margin-top:3px; font-size:22px; letter-spacing:-.04em; } .summary-card em { color:#778093; font-style:normal; font-size:11px; }
    .workspace { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:var(--shadow); } .toolbar { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); } .tool-button { display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border:1px solid transparent; border-radius:8px; color:#616878; background:transparent; font-weight:650; } .tool-button:hover { border-color:#dcdfE8; background:#f8f8fb; } .tool-button.active { color:#513bc9; border-color:#dcd5ff; background:#f6f3ff; } .tool-button.primary { margin-left:auto; border-color:#7058ed; color:#fff; background:var(--violet); } .tool-button.primary:hover { background:#5e46db; }
    .table-wrap { min-height:460px; overflow:auto; } table { width:100%; min-width:930px; border-collapse:collapse; table-layout:fixed; } th { height:49px; padding:0 12px; border-bottom:1px solid var(--line); color:#878d9d; background:#fbfbfd; text-align:left; font-size:12px; font-weight:750; } td { padding:11px 12px; border-bottom:1px solid #f0f1f5; vertical-align:middle; } tbody tr { transition:background .16s ease; } tbody tr:hover { background:#fafaff; } .check { width:15px; height:15px; accent-color:var(--violet); } .num { color:#8b91a0; font-variant-numeric:tabular-nums; } .person { display:flex; align-items:center; gap:9px; min-width:0; } .person .avatar { width:34px; height:34px; color:#fff; background:#d9dce6; } .person-copy { min-width:0; } .person strong,.person small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .person strong { font-size:13px; } .person small { color:#8c93a2; font-size:12px; } .folder-tag { display:inline-block; max-width:100%; overflow:hidden; padding:4px 8px; border-radius:7px; color:#676e7c; background:#f3f4f7; text-overflow:ellipsis; white-space:nowrap; font-size:12px; } .tweet-text { display:-webkit-box; overflow:hidden; max-width:100%; font-weight:580; line-height:1.42; -webkit-box-orient:vertical; -webkit-line-clamp:2; } .media { display:flex; gap:4px; } .media img,.media-empty { width:40px; height:40px; border-radius:6px; object-fit:cover; background:#f3f4f7; } .media-more { display:grid; place-items:center; width:40px; height:40px; border-radius:6px; color:#676e7c; background:#f3f4f7; font-size:11px; } .metric { color:#454b59; font-weight:700; font-variant-numeric:tabular-nums; }
    .empty { display:grid; min-height:455px; place-items:center; padding:30px; text-align:center; } .empty-inner { max-width:410px; } .empty-icon { display:grid; width:48px; height:48px; place-items:center; margin:0 auto 13px; border-radius:15px; color:#684fdf; background:#f0edff; font-size:23px; } .empty h2 { margin:0; font-size:18px; } .empty p { margin:8px 0 16px; color:#777e8f; font-size:13px; } .empty button { padding:9px 12px; border:1px solid #dcdfe7; border-radius:8px; color:#3e4554; background:#fff; font-weight:700; } .empty button:hover { background:#f7f7fa; }
    .footer { display:flex; align-items:center; gap:16px; min-height:60px; padding:10px 14px; color:#7f8696; font-size:12px; } .footer strong { color:#4a5060; } .pager { display:flex; gap:5px; margin-left:auto; } .page-button { min-width:30px; height:30px; border:1px solid #e1e3ea; border-radius:7px; color:#5d6473; background:#fff; } .page-button:disabled { color:#b5b9c4; background:#fafafd; cursor:not-allowed; } .page-button.active { border-color:#7058ed; color:#fff; background:var(--violet); }
    .privacy { display:flex; align-items:center; gap:7px; margin-top:14px; padding:10px 13px; border:1px solid #e4ddff; border-radius:10px; color:#6656a4; background:#faf8ff; font-size:12px; } .privacy b { color:#4e3aaf; }
    @media (max-width:1200px) { body { min-width:900px; } .app { grid-template-columns:210px minmax(0,1fr); } .sidebar { padding-right:10px; padding-left:10px; } .main { padding-right:20px; padding-left:20px; } .top { padding:0 20px; } .summary { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/"><img src="/icons/x-tools-logo.png" alt="X-Tools">X-Tools</a>
      <div class="side-label">我的数据</div>
      <nav class="nav" aria-label="工作台导航">
        <button class="nav-item active" type="button"><span class="nav-icon">▣</span>书签工作台</button>
        <button class="nav-item" type="button" id="open-extension"><span class="nav-icon">↗</span>打开扩展</button>
        <a class="nav-item" href="/#pricing"><span class="nav-icon">✦</span>会员订阅</a>
      </nav>
      <section class="folders"><div class="folder-head"><span>本机文件夹</span><span id="folder-total">0</span></div><div class="folder-list" id="folders"><button class="folder-item active" type="button" data-folder="all"><span>▱</span><strong>全部书签</strong><small>0</small></button></div></section>
      <div class="profile"><div class="avatar" id="avatar">X</div><div class="profile-copy"><strong id="profile-email">正在读取账户…</strong><small id="profile-tier">官网会话</small></div></div>
    </aside>
    <div class="content">
      <header class="top"><nav class="tabs" aria-label="数据类型"><button class="tab active" type="button" data-tab="all">▣ 书签 <span class="count" id="tab-bookmarks">0</span></button><button class="tab" type="button" data-tab="media">▧ 媒体 <span class="count" id="tab-media">0</span></button><button class="tab" type="button" data-tab="authors">♙ 用户 <span class="count" id="tab-authors">0</span></button></nav><div class="top-tools"><span class="member" id="member-state">读取订阅…</span><label class="search">⌕<input id="search" type="search" placeholder="搜索推文、用户或文件夹"></label></div></header>
      <main class="main">
        <section class="headline"><div><h1>书签工作台</h1><p>在官网查看此浏览器中由 X-Tools 扩展整理的本机书签。</p></div><div class="sync-state" id="sync-state"><span class="sync-dot"></span><span>正在连接扩展…</span></div></section>
        <section class="summary" aria-label="书签概览"><article class="summary-card"><span>已同步书签</span><strong id="stat-bookmarks">—</strong><em>当前浏览器本机缓存</em></article><article class="summary-card"><span>文件夹</span><strong id="stat-folders">—</strong><em>来自 X 书签分类</em></article><article class="summary-card"><span>包含媒体</span><strong id="stat-media">—</strong><em>图片与视频推文</em></article><article class="summary-card"><span>覆盖用户</span><strong id="stat-authors">—</strong><em>去重后的作者数</em></article></section>
        <section class="workspace"><div class="toolbar"><button class="tool-button active" type="button" data-media-filter="all">全部内容</button><button class="tool-button" type="button" data-media-filter="media">仅媒体</button><button class="tool-button" type="button" data-media-filter="no-media">纯文本</button><button class="tool-button primary" id="refresh" type="button">↻ 从扩展刷新</button></div><div class="table-wrap" id="table-wrap"><table id="table"><thead><tr><th style="width:48px"><input class="check" id="check-all" type="checkbox" aria-label="全选"></th><th style="width:55px">#</th><th style="width:190px">用户</th><th style="width:150px">文件夹</th><th>推文</th><th style="width:148px">媒体文件</th><th style="width:95px">浏览量</th><th style="width:85px">互动</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden><div class="empty-inner"><div class="empty-icon">▣</div><h2 id="empty-title">正在读取扩展数据</h2><p id="empty-copy">请稍候，X-Tools 正在安全连接本机书签。</p><button id="empty-action" type="button">重新尝试</button></div></div></div><footer class="footer"><span id="selected">已选择 <strong>0</strong> 条</span><span id="range">—</span><div class="pager" id="pager"></div></footer></section>
        <div class="privacy">▣ <span><b>本机直连：</b>书签仅从已安装的扩展读取并显示在当前页面，不会上传到 X-Tools 服务器。</span></div>
      </main>
    </div>
  </div>
  <script>
    const state = { rows: [], folders: [], activeFolder: 'all', mediaFilter: 'all', tab: 'all', query: '', page: 1, pageSize: 25, selected: new Set(), extensionId: null, extensionReady: false };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    const number = (value) => { const n = Number(value) || 0; return n >= 1000000 ? `${(n / 1000000).toFixed(n >= 10000000 ? 0 : 1)}M` : n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}K` : String(n); };
    const avatar = (row) => row.avatar ? `<img src="${escapeHtml(row.avatar)}" alt="">` : escapeHtml((row.name || 'X')[0].toUpperCase());
    function setSync(text, ready = false) { $('#sync-state').classList.toggle('ready', ready); $('#sync-state span:last-child').textContent = text; }
    function activeRows() { const query = state.query.trim().toLocaleLowerCase(); const seenAuthors = new Set(); return state.rows.filter((row) => { const folder = state.activeFolder === 'all' || row.folderId === state.activeFolder; const media = state.mediaFilter === 'all' || (state.mediaFilter === 'media' ? row.media.length : !row.media.length); const isFirstAuthor = !seenAuthors.has(row.handle); seenAuthors.add(row.handle); const tab = state.tab === 'all' || (state.tab === 'media' ? row.media.length : isFirstAuthor); const search = !query || `${row.name} ${row.handle} ${row.folderName} ${row.text}`.toLocaleLowerCase().includes(query); return folder && media && tab && search; }); }
    function renderFolders() { const counts = new Map(state.rows.map((row) => [row.folderId, 0])); state.rows.forEach((row) => counts.set(row.folderId, (counts.get(row.folderId) || 0) + 1)); $('#folder-total').textContent = state.folders.length; $('#folders').innerHTML = `<button class="folder-item ${state.activeFolder === 'all' ? 'active' : ''}" type="button" data-folder="all"><span>▱</span><strong>全部书签</strong><small>${state.rows.length}</small></button>${state.folders.map((folder) => `<button class="folder-item ${state.activeFolder === folder.id ? 'active' : ''}" type="button" data-folder="${escapeHtml(folder.id)}"><span>⌑</span><strong>${escapeHtml(folder.name)}</strong><small>${counts.get(folder.id) || 0}</small></button>`).join('')}`; }
    function renderSummary() { const media = state.rows.filter((row) => row.media.length).length; const authors = new Set(state.rows.map((row) => row.handle)).size; [['stat-bookmarks', state.rows.length], ['stat-folders', state.folders.length], ['stat-media', media], ['stat-authors', authors], ['tab-bookmarks', state.rows.length], ['tab-media', media], ['tab-authors', authors]].forEach(([id, value]) => { $(`#${id}`).textContent = number(value); }); }
    function renderRows() { const filtered = activeRows(); const pages = Math.max(1, Math.ceil(filtered.length / state.pageSize)); state.page = Math.min(state.page, pages); const start = (state.page - 1) * state.pageSize; const visible = filtered.slice(start, start + state.pageSize); const hasData = state.rows.length > 0; $('#table').hidden = !hasData; $('#empty').hidden = hasData; if (!hasData) { $('#empty-title').textContent = state.extensionReady ? '扩展中还没有书签数据' : '未连接到 X-Tools 扩展'; $('#empty-copy').textContent = state.extensionReady ? '先在 X 的书签页停留片刻，让扩展完成本机缓存，然后点击“从扩展刷新”。' : '请确认扩展已安装、已重新加载到最新版，并在此官网账号下完成同步。'; $('#empty-action').textContent = state.extensionReady ? '从扩展刷新' : '返回官网安装扩展'; return; } $('#rows').innerHTML = visible.map((row, index) => `<tr><td><input class="check row-check" data-id="${escapeHtml(row.id)}" type="checkbox" ${state.selected.has(row.id) ? 'checked' : ''} aria-label="选择书签"></td><td class="num">${start + index + 1}</td><td><div class="person"><span class="avatar">${avatar(row)}</span><span class="person-copy"><strong>${escapeHtml(row.name)}</strong><small>${escapeHtml(row.handle)}</small></span></div></td><td><span class="folder-tag">${escapeHtml(row.folderName)}</span></td><td><div class="tweet-text">${escapeHtml(row.text)}</div></td><td><div class="media">${row.media.slice(0, 2).map((url) => `<img src="${escapeHtml(url)}" alt="推文媒体" loading="lazy">`).join('') || '<span class="media-empty"></span>'}${row.media.length > 2 ? `<span class="media-more">+${row.media.length - 2}</span>` : ''}</div></td><td class="metric">${number(row.views)}</td><td class="metric">${number(row.engagement)}</td></tr>`).join(''); $('#range').textContent = filtered.length ? `显示 ${start + 1}–${Math.min(start + state.pageSize, filtered.length)} / ${filtered.length}` : '没有匹配内容'; $('#selected').innerHTML = `已选择 <strong>${state.selected.size}</strong> 条`; $('#check-all').checked = visible.length > 0 && visible.every((row) => state.selected.has(row.id)); $('#pager').innerHTML = `<button class="page-button" type="button" data-page="prev" ${state.page === 1 ? 'disabled' : ''}>‹</button>${Array.from({ length: pages }, (_, index) => index + 1).slice(Math.max(0, state.page - 3), Math.min(pages, state.page + 2)).map((page) => `<button class="page-button ${page === state.page ? 'active' : ''}" type="button" data-page="${page}">${page}</button>`).join('')}<button class="page-button" type="button" data-page="next" ${state.page === pages ? 'disabled' : ''}>›</button>`; }
    function render() { renderFolders(); renderSummary(); renderRows(); }
    function externalMessage(id, message) { return new Promise((resolve) => { try { chrome.runtime.sendMessage(id, message, (response) => resolve(chrome.runtime.lastError ? null : response)); } catch (_) { resolve(null); } }); }
    async function extensionIds() { const response = await fetch('/api/extension-handoff/config', { credentials:'include' }); const data = response.ok ? await response.json() : null; return Array.isArray(data?.extensionIds) ? data.extensionIds : []; }
    async function loadSnapshot() { setSync('正在连接扩展…'); const ids = state.extensionId ? [state.extensionId] : await extensionIds(); for (const id of ids) { const response = await externalMessage(id, { type:'XVM_WEBSITE_DASHBOARD_SNAPSHOT' }); if (response?.ok && response.snapshot) { state.extensionId = id; state.extensionReady = true; state.rows = Array.isArray(response.snapshot.rows) ? response.snapshot.rows : []; state.folders = Array.isArray(response.snapshot.folders) ? response.snapshot.folders : []; const at = Number(response.snapshot.refreshedAt) || 0; setSync(at ? `本机数据更新于 ${new Date(at).toLocaleString([], { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}` : '扩展已连接，等待书签缓存', true); render(); return; } } state.extensionReady = false; setSync('未检测到已连接的扩展'); render(); }
    async function loadAccount() { const sessionResponse = await fetch('/api/auth/get-session', { credentials:'include', headers:{Accept:'application/json'} }); const session = sessionResponse.ok ? await sessionResponse.json() : null; if (!session?.user?.id) { location.replace('/'); return false; } const user = session.user; $('#profile-email').textContent = user.email || '已登录账户'; $('#avatar').textContent = (user.email || user.name || 'X')[0].toUpperCase(); const subscriptionResponse = await fetch('/api/subscription/status', { credentials:'include', headers:{Accept:'application/json'} }); const subscription = subscriptionResponse.ok ? await subscriptionResponse.json() : null; const pro = subscription?.tier === 'pro' && subscription?.status === 'active'; $('#member-state').textContent = pro ? '✦ 会员有效' : '免费版'; $('#profile-tier').textContent = pro ? '会员 · 官网与扩展已同步' : '免费账户 · 官网已同步'; return true; }
    function bind() { $('#search').addEventListener('input', (event) => { state.query = event.target.value; state.page = 1; renderRows(); }); document.addEventListener('click', (event) => { const folder = event.target.closest('[data-folder]'); if (folder) { state.activeFolder = folder.dataset.folder; state.page = 1; render(); return; } const media = event.target.closest('[data-media-filter]'); if (media) { state.mediaFilter = media.dataset.mediaFilter; document.querySelectorAll('[data-media-filter]').forEach((button) => button.classList.toggle('active', button === media)); state.page = 1; renderRows(); return; } const tab = event.target.closest('[data-tab]'); if (tab) { state.tab = tab.dataset.tab; document.querySelectorAll('[data-tab]').forEach((button) => button.classList.toggle('active', button === tab)); state.page = 1; renderRows(); return; } const page = event.target.closest('[data-page]'); if (page) { const pages = Math.max(1, Math.ceil(activeRows().length / state.pageSize)); state.page = page.dataset.page === 'prev' ? Math.max(1, state.page - 1) : page.dataset.page === 'next' ? Math.min(pages, state.page + 1) : Number(page.dataset.page); renderRows(); } }); $('#refresh').addEventListener('click', loadSnapshot); $('#empty-action').addEventListener('click', () => state.extensionReady ? loadSnapshot() : location.assign('/')); $('#open-extension').addEventListener('click', async () => { if (state.extensionId) await externalMessage(state.extensionId, { type:'XVM_WEBSITE_AUTH_OPEN_WORKSPACE' }); }); $('#check-all').addEventListener('change', (event) => { const visible = activeRows().slice((state.page - 1) * state.pageSize, state.page * state.pageSize); visible.forEach((row) => event.target.checked ? state.selected.add(row.id) : state.selected.delete(row.id)); renderRows(); }); $('#rows').addEventListener('change', (event) => { if (!event.target.matches('.row-check')) return; event.target.checked ? state.selected.add(event.target.dataset.id) : state.selected.delete(event.target.dataset.id); $('#selected').innerHTML = `已选择 <strong>${state.selected.size}</strong> 条`; }); }
    (async () => { bind(); if (await loadAccount()) await loadSnapshot(); })().catch(() => { setSync('连接失败，请刷新重试'); render(); });
  </script>
</body>
</html>
