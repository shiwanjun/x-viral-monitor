<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-Tools 同步工作台</title>
  <style>
    :root { color-scheme: dark; --bg:#090a10; --panel:#12141e; --panel-2:#181b27; --ink:#f4f5fb; --muted:#9da4b8; --line:#ffffff18; --violet:#7c5cff; --green:#62db72; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(800px 500px at 50% -180px,#6d4dff35,transparent 68%),var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { width:min(1080px,calc(100% - 40px)); margin:auto; padding:24px 0 70px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:13px 16px; border:1px solid var(--line); border-radius:17px; background:#0d0f17cc; backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; } .brand img { width:31px; height:31px; border-radius:9px; } a { color:inherit; text-decoration:none; } .back { color:var(--muted); font-size:14px; }
    .hero { padding:75px 0 34px; } .eyebrow { color:#b3a6ff; font-size:11px; letter-spacing:.13em; font-weight:800; } h1 { margin:8px 0 10px; font-size:clamp(34px,7vw,58px); letter-spacing:-.055em; line-height:1; } .hero p { max-width:650px; margin:0; color:var(--muted); font-size:17px; }
    .grid { display:grid; grid-template-columns:1.15fr .85fr; gap:14px; } .card { min-height:190px; padding:20px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,#161927,#10121b); } .card h2 { margin:0 0 5px; font-size:17px; } .card p { margin:0; color:var(--muted); font-size:13px; }
    .account { display:flex; align-items:center; gap:12px; margin:19px 0; } .avatar { display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:#7c5cff27; color:#c7bcff; font-size:19px; font-weight:800; } .account strong,.account small { display:block; } .account small { color:var(--muted); }
    .badge { display:inline-flex; align-items:center; gap:7px; padding:7px 10px; border-radius:999px; color:var(--green); background:#62db7213; border:1px solid #62db7240; font-weight:700; font-size:12px; } .dot { width:7px; height:7px; background:currentColor; border-radius:50%; }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:17px; } .stat { padding:13px; border-radius:12px; background:var(--panel-2); } .stat span { display:block; color:var(--muted); font-size:12px; } .stat b { display:block; margin-top:3px; font-size:16px; }
    .action { display:inline-flex; margin-top:17px; padding:10px 14px; border:0; border-radius:10px; background:var(--violet); color:white; font:inherit; font-weight:750; cursor:pointer; } .action.secondary { background:transparent; border:1px solid var(--line); color:var(--ink); margin-left:7px; }
    .notice { grid-column:1/-1; padding:16px 18px; border:1px solid #7c5cff42; border-radius:15px; background:#7c5cff10; color:#d6d1ff; } .notice b { color:white; }
    @media (max-width:720px) { .shell { width:min(100% - 24px,620px); } .grid { grid-template-columns:1fr; } .hero { padding-top:48px; } header { border-radius:13px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="/"><img src="/icons/x-tools-logo.png" alt="X-Tools">X-Tools</a><a class="back" href="/">返回官网</a></header>
    <main><section class="hero"><div class="eyebrow">ACCOUNT · SYNC CENTER</div><h1>账户与同步工作台</h1><p>这里是官网账号与会员状态的统一入口。本机书签和 X 扫描数据仍由浏览器扩展安全保存在你的设备上。</p></section>
      <section class="grid">
        <article class="card"><h2>账户状态</h2><p>当前官网登录会话</p><div class="account"><div class="avatar" id="avatar">X</div><div><strong id="email">正在读取账号…</strong><small id="name">请稍候</small></div></div><span class="badge"><span class="dot"></span>已登录</span><br><button class="action" id="signout">退出登录</button></article>
        <article class="card"><h2>会员订阅</h2><p>由 X-Tools 服务端同步</p><div class="stats"><div class="stat"><span>当前方案</span><b id="plan">读取中</b></div><div class="stat"><span>状态</span><b id="status">读取中</b></div></div><a class="action" href="/#pricing">管理订阅</a></article>
        <article class="notice"><b>浏览器扩展已同步。</b> 扩展负责本机书签、取关扫描和 X 页面功能；登录、会员与云端同步状态则在此域名下统一管理。</article>
      </section>
    </main>
  </div>
  <script>
    (async () => {
      const sessionResponse = await fetch('/api/auth/get-session', { credentials:'include', headers:{Accept:'application/json'} });
      const session = sessionResponse.ok ? await sessionResponse.json() : null;
      if (!session?.user?.id) { location.replace('/'); return; }
      const user = session.user; document.querySelector('#email').textContent = user.email || '已登录账户'; document.querySelector('#name').textContent = user.name || 'Google 账户'; document.querySelector('#avatar').textContent = (user.email || user.name || 'X')[0].toUpperCase();
      const subscriptionResponse = await fetch('/api/subscription/status', { credentials:'include', headers:{Accept:'application/json'} });
      const subscription = subscriptionResponse.ok ? await subscriptionResponse.json() : null;
      document.querySelector('#plan').textContent = subscription?.tier === 'pro' ? '会员' : '免费版'; document.querySelector('#status').textContent = subscription?.status === 'active' ? '有效' : '正常';
      document.querySelector('#signout').addEventListener('click', async () => { await fetch('/api/auth/sign-out', { method:'POST', credentials:'include' }); location.replace('/'); });
    })().catch(() => location.replace('/'));
  </script>
</body>
</html>
