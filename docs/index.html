  <script>
    // Apply persisted theme before first paint (avoid flash).
    (function () {
      try {
        var t = localStorage.getItem('xvm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08080c;
      --bg-2: #0d0d14;
      --surface: #13131c;
      --surface-2: #1a1a26;
      --ink: #f2f3f7;
      --muted: #9aa0b4;
      --faint: #6b7085;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.16);
      --primary: #7c5cff;
      --primary-ink: #ffffff;
      --primary-soft: rgba(124, 92, 255, 0.14);
      --primary-glow: rgba(124, 92, 255, 0.28);
      --green: #58e44e;
      --amber: #fbbf24;
      --red: #ff5d5d;
      --nav-bg: rgba(8, 8, 12, 0.72);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      --radius: 16px;
      --max: 1200px;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fbfbfd;
      --bg-2: #f3f3f8;
      --surface: #ffffff;
      --surface-2: #f6f6fa;
      --ink: #16161f;
      --muted: #5d6377;
      --faint: #8b90a3;
      --line: rgba(12, 12, 24, 0.10);
      --line-strong: rgba(12, 12, 24, 0.18);
      --primary: #5b3df5;
      --primary-ink: #ffffff;
      --primary-soft: rgba(91, 61, 245, 0.10);
      --primary-glow: rgba(91, 61, 245, 0.16);
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --nav-bg: rgba(251, 251, 253, 0.78);
      --shadow: 0 24px 60px rgba(20, 20, 40, 0.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 420px at 50% -120px, var(--primary-glow), transparent 65%),
        radial-gradient(700px 380px at 85% 8%, rgba(251, 191, 36, 0.10), transparent 60%),
        radial-gradient(700px 380px at 12% 14%, rgba(88, 228, 78, 0.07), transparent 60%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 42rem, var(--bg) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(900px 500px at 50% 0%, #000 30%, transparent 75%);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    img, svg { display: block; }
    h1, h2, h3, p { margin: 0; }
    .wrap { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }
    section { padding: 84px 0; scroll-margin-top: 96px; }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { border-color: var(--primary); transform: translateY(-1px); }
    .btn.primary {
      background: var(--primary);
      border-color: transparent;
      color: var(--primary-ink);
      box-shadow: 0 8px 26px var(--primary-glow);
    }
    .btn.primary:hover { filter: brightness(1.08); box-shadow: 0 10px 32px var(--primary-glow); }
    .btn.sm { padding: 8px 16px; font-size: 14px; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--ink); border-color: var(--line); }
    .auth-btn { min-width: 102px; }
    .auth-btn[data-authenticated="true"] { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); color: var(--green); }
    .handoff-status {
      position: fixed; z-index: 49; top: 84px; right: max(20px, calc((100vw - var(--max)) / 2));
      max-width: min(360px, calc(100vw - 40px)); padding: 9px 12px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
    }
    .handoff-status a, .handoff-status button { color: var(--primary); font: inherit; font-weight: 650; }
    .handoff-status button { padding: 0; border: 0; background: none; cursor: pointer; }

    /* ── Nav ─────────────────────────────────────────────────────── */
    .nav { position: fixed; inset: 0 0 auto 0; z-index: 50; padding: 12px 20px 0; }
    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 12px 10px 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
    .brand svg { width: 30px; height: 30px; border-radius: 8px; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a {
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.15s ease, background 0.15s ease;
    }
    .nav-links a:hover { color: var(--ink); background: var(--surface-2); }
    .nav-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn .ico-sun { display: none; }
    :root[data-theme="light"] .icon-btn .ico-sun { display: block; }
    :root[data-theme="light"] .icon-btn .ico-moon { display: none; }

    .lang-menu { position: relative; }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
    }
    .lang-toggle svg { width: 15px; height: 15px; color: var(--muted); transition: transform 0.2s ease; }
    .lang-menu.open .lang-toggle svg { transform: rotate(180deg); }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 168px;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    }
    .lang-menu.open .lang-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .lang-dropdown button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-size: 14px;
      transition: color 0.12s ease, background 0.12s ease;
    }
    .lang-dropdown button:hover { color: var(--ink); background: var(--surface-2); }
    .lang-dropdown button.active { color: var(--primary); font-weight: 700; }

    .burger { display: none; }
    .nav-mobile {
      display: none;
      margin: 8px auto 0;
      max-width: var(--max);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .nav-mobile.open { display: block; }
    .nav-mobile a {
      display: block;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }
    .nav-mobile a:hover { color: var(--ink); background: var(--surface-2); }

    /* ── Section header ──────────────────────────────────────────── */
    .sec-head { max-width: 720px; margin: 0 auto 52px; text-align: center; }
    .sec-head h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
    .sec-head .lead { margin-top: 14px; font-size: 16.5px; color: var(--muted); }

    /* ── Hero ────────────────────────────────────────────────────── */
    .hero { padding: 168px 0 96px; text-align: center; }
    .hero .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
    }
    .hero .badge b { color: var(--primary); }
    .hero h1 {
      max-width: 860px;
      margin: 26px auto 0;
      font-size: clamp(34px, 5.4vw, 60px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.12;
      text-wrap: balance;
    }
    .hero .lead {
      max-width: 680px;
      margin: 22px auto 0;
      font-size: 17.5px;
      color: var(--muted);
    }
    .hero .cta-row { display: flex; justify-content: center; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
    .hero .hint { margin-top: 16px; font-size: 13px; color: var(--faint); }

    .hero-visual {
      max-width: 560px;
      margin: 56px auto 0;
      padding: 20px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: left;
    }
    .tweet-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid transparent;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .tweet-row:hover { border-color: var(--line); background: var(--surface-2); }
    .avatar {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary-soft), var(--line));
    }
    .tweet-lines { flex: 1; display: grid; gap: 6px; }
    .tweet-lines span { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
    .tweet-lines span:first-child { width: 46%; }
    .rate-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--line);
    }
    .rate-pill.green { color: var(--green); background: rgba(88, 228, 78, 0.09); }
    .rate-pill.amber { color: var(--amber); background: rgba(251, 191, 36, 0.10); }
    .rate-pill.red { color: var(--red); background: rgba(255, 93, 93, 0.10); }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
    .bars i {
      width: 4px;
      border-radius: 2px;
      background: currentColor;
      opacity: 0.75;
      animation: barPulse 2.4s ease-in-out infinite;
    }
    .bars i:nth-child(2) { animation-delay: 0.3s; }
    .bars i:nth-child(3) { animation-delay: 0.6s; }
    @keyframes barPulse { 0%, 100% { height: 30%; } 50% { height: 100%; } }

    /* ── Card grid (features / integrations / installs) ──────────── */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    #install-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 736px;
      margin: 0 auto;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }
    .card:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); transform: translateY(-2px); }
    .card .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      font-size: 20px;
    }
    .card h3 { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
    .card p { font-size: 14px; color: var(--muted); line-height: 1.62; }
    .card .tag {
      align-self: flex-start;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card .tag.pro { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
    .card .tag.planned { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }

    .int-card { flex-direction: row; align-items: flex-start; gap: 14px; padding: 18px 20px; }
    .int-card .logo {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }
    .int-card h3 { font-size: 15px; }
    .int-card p { font-size: 13px; }
    .int-card .tag { margin-top: 4px; }

    /* ── Stats ───────────────────────────────────────────────────── */
    .stats-band {
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
    }
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; text-align: center; }
    .stat b {
      display: block;
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--ink), color-mix(in srgb, var(--primary) 60%, var(--ink)));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat span { display: block; margin-top: 6px; font-size: 13.5px; color: var(--muted); }

    /* ── Pricing ─────────────────────────────────────────────────── */
    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 288px));
      justify-content: center;
      gap: 16px;
      align-items: stretch;
    }
    .plan {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 26px 24px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .plan:hover { transform: translateY(-3px); }
    .plan.popular {
      border-color: color-mix(in srgb, var(--primary) 60%, var(--line));
      box-shadow: 0 18px 50px var(--primary-glow);
    }
    .plan .pop-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .plan h3 { font-size: 17px; font-weight: 800; }
    .plan .price { display: flex; align-items: baseline; gap: 4px; margin-top: 14px; }
    .plan .price b { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
    .plan .price span { font-size: 13.5px; color: var(--muted); }
    .plan .note { margin-top: 10px; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .plan ul { flex: 1; margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
    .plan li { display: flex; gap: 8px; font-size: 13.5px; color: var(--muted); }
    .plan li::before { content: "✓"; flex: none; color: var(--green); font-weight: 800; }
    .plan .btn { margin-top: 22px; width: 100%; }

    /* ── FAQ ─────────────────────────────────────────────────────── */
    .faq-list { max-width: 740px; margin: 0 auto; display: grid; gap: 10px; }
    .faq-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden;
      transition: border-color 0.18s ease;
    }
    .faq-item[open] { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
    .faq-item summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 20px;
      cursor: pointer;
      font-size: 15.5px;
      font-weight: 600;
      list-style: none;
      user-select: none;
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::after {
      content: "";
      flex: none;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 0.2s ease;
    }
    .faq-item[open] summary::after { transform: rotate(-135deg); }
    .faq-item .a { padding: 0 20px 18px; font-size: 14.5px; color: var(--muted); line-height: 1.7; }

    /* ── CTA band ────────────────────────────────────────────────── */
    .cta-band {
      padding: 64px 32px;

    function store(key, value) {
      try { localStorage.setItem(key, value); } catch (_) {}
    }
    function read(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v == null ? fallback : v;
      } catch (_) { return fallback; }
    }

    let currentLang = 'zh-CN';
    let siteSession = null;
    const params = new URLSearchParams(window.location.search);
    const extensionLoginRequested = params.get('extensionLogin') === '1';
    let extensionLoginStarted = false;
    if (params.get('lang') && LANGS.includes(params.get('lang'))) {
      currentLang = params.get('lang');
    } else if (LANGS.includes(read('xvm-lang', ''))) {
      currentLang = read('xvm-lang', '');

    function t() { return I18N[LANG_KEY[currentLang]]; }
    function authCopy() { return SITE_AUTH_COPY[currentLang] || SITE_AUTH_COPY.en; }

    function renderAuthButton() {
      const button = document.getElementById('auth-button');
      if (!button) return;
      const copy = authCopy();
      const signedIn = Boolean(siteSession?.user);
      button.dataset.authenticated = signedIn ? 'true' : 'false';
      button.textContent = signedIn ? copy.signedIn : copy.signIn;
      button.title = signedIn ? copy.signOut : copy.signIn;
      button.setAttribute('aria-label', button.title);
    }

    async function refreshSiteSession() {
      try {
        const res = await fetch('/api/auth/get-session', { credentials: 'include', headers: { Accept: 'application/json' } });
        siteSession = res.ok ? await res.json() : null;
      } catch (_) {
        siteSession = null;
      }
      renderAuthButton();
      if (siteSession?.user) {
        void syncWebsiteLoginToExtension();
      } else if (extensionLoginRequested && !extensionLoginStarted) {
        extensionLoginStarted = true;
        void startGoogleSignIn(location.href);
      }
    }

    async function startGoogleSignIn(callbackURL = location.href) {
      const button = document.getElementById('auth-button');
      if (button) button.disabled = true;
      try {
        const res = await fetch('/api/auth/sign-in/social', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ provider: 'google', callbackURL }),
        });
        const data = await res.json().catch(() => null);
        const authorizationUrl = data?.url || data?.redirectURL || (typeof data?.redirect === 'string' ? data.redirect : '');
        if (!res.ok || !authorizationUrl) throw new Error(data?.message || data?.error || 'google_sign_in_failed');
        location.assign(authorizationUrl);
      } catch (_) {
        if (button) button.disabled = false;
        alert(authCopy().error);
      }
    }

    async function signOutSite() {
      try {
        await fetch('/api/auth/sign-out', { method: 'POST', credentials: 'include' });
      } finally {
        for (const extensionId of extensionIds) void extensionMessage(extensionId, { type: 'XVM_WEBSITE_AUTH_SIGN_OUT' });
        siteSession = null;
        renderAuthButton();
        renderHandoffStatus(null);
      }
    }

    const EXTENSION_ID = 'bionhgeckdccebiialhfkdaniblofbmf';
    let extensionIds = [EXTENSION_ID];
    let handoffInFlight = null;

    function extensionRuntime() {
      return globalThis.chrome?.runtime?.sendMessage ? globalThis.chrome.runtime : null;
    }

    function extensionMessage(extensionId, message) {
      const runtime = extensionRuntime();
      if (!runtime) return Promise.resolve(null);
      return new Promise((resolve) => {
        try {
          runtime.sendMessage(extensionId, message, (reply) => {
            // Missing extension produces lastError; it is an expected state.
            void chrome.runtime.lastError;
            resolve(reply || null);
          });
        } catch (_) { resolve(null); }
      });
    }

    async function loadExtensionIds() {
      try {
        const response = await fetch('/api/extension-handoff/config', { headers: { Accept: 'application/json' } });
        const payload = response.ok ? await response.json() : null;
        if (Array.isArray(payload?.extensionIds) && payload.extensionIds.every((id) => /^[a-p]{32}$/.test(id))) {
          extensionIds = payload.extensionIds;
        }
      } catch (_) {
        // The fixed production ID remains a safe fallback.
      }
      return extensionIds;
    }

    function renderHandoffStatus(kind) {
      const status = document.getElementById('extension-handoff-status');
      if (!status) return;
      const messages = {
        synced: '已同步到 X-Tools 插件，并已打开工作台。',
        alreadySynced: 'X-Tools 插件已登录同一账号。',
        unavailable: `已登录官网。<a href="${STORE_URL}" target="_blank" rel="noopener">安装 X-Tools 插件</a> 后可自动同步。`,
        failed: '官网登录成功，但同步到插件失败。<button type="button" id="retry-extension-sync">重试同步</button>',
      };
      status.hidden = !messages[kind];
      status.innerHTML = messages[kind] || '';
    }

    async function handoffToExtension() {
      if (!siteSession?.user || handoffInFlight) return handoffInFlight;
      handoffInFlight = (async () => {
        const ids = await loadExtensionIds();
        let extensionId = null;
        let probe = null;
        for (const candidate of ids) {
          const reply = await extensionMessage(candidate, { type: 'XVM_WEBSITE_AUTH_PROBE' });
          if (reply?.ok) { extensionId = candidate; probe = reply; break; }
        }
        if (!probe?.ok) return { ok: false, reason: 'extension_unavailable' };
        if (probe.email && probe.email === siteSession.user.email) return { ok: true, alreadySynced: true };
        const created = await fetch('/api/extension-handoff/create', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ extensionId }),
        });
        const payload = await created.json().catch(() => null);
        if (!created.ok || !payload?.ok || !payload?.code) return { ok: false, reason: payload?.error || 'handoff_create_failed' };
        const result = await extensionMessage(extensionId, { type: 'XVM_WEBSITE_AUTH_HANDOFF', code: payload.code });
        return result?.ok ? { ok: true } : { ok: false, reason: result?.error || 'handoff_exchange_failed' };
      })();
      try { return await handoffInFlight; } finally { handoffInFlight = null; }
    }

    async function syncWebsiteLoginToExtension() {
      const result = await handoffToExtension();
      if (result?.ok) {
        const button = document.getElementById('auth-button');
        if (button) { button.textContent = '已同步至插件工作台'; button.dataset.authenticated = 'true'; }
        renderHandoffStatus(result.alreadySynced ? 'alreadySynced' : 'synced');
      } else if (result?.reason === 'extension_unavailable') {
        renderHandoffStatus('unavailable');
      } else {
        renderHandoffStatus('failed');
      }
      return result;
    }

        const res = await fetch('/api/checkout/start', {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },

        if (res.status === 401) {
          const callback = `${location.origin}/?checkout=${encodeURIComponent(interval)}#pricing`;
          await startGoogleSignIn(callback);
          return;
        }
        const data = await res.json();
        if (data?.ok && data.checkoutUrl) location.href = data.checkoutUrl;
        else throw new Error(data?.error || 'checkout_failed');
      } catch (_) {
        location.href = '#pricing';
        alert('Unable to start checkout. Please try again.');
      }
    }

      ).join('');

      // simple data-i18n fills
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.dataset.i18n;
        if (T[key] != null) el.textContent = T[key];
      });
      // CTA button href + label
      const ctaBtn = document.getElementById('cta-btn');
      ctaBtn.textContent = T.ctaBtn;

      // features grid
      document.getElementById('features-grid').innerHTML = T.features.map(([title, desc, tag]) => {
        const tagHtml = tag
          ? `<span class="tag ${tag === 'pro' ? 'pro' : 'planned'}">${tag === 'pro' ? membership.badge : 'Soon'}</span>`
          : '';
        return `<article class="card"><span class="icon">✦</span>${tagHtml}<h3>${escapeHtml(title)}</h3><p>${escapeHtml(desc)}</p></article>`;
      }).join('');

      // integrations grid
      document.getElementById('integrations-grid').innerHTML = T.integrations.map(([name, role, tag]) =>
        `<article class="card int-card"><span class="logo">${escapeHtml(tag)}</span><div><h3>${escapeHtml(name)}</h3><p>${escapeHtml(role)}</p></div></article>`
      ).join('');

      // stats
      document.getElementById('stats-grid').innerHTML = T.stats.map(([value, label]) =>
        `<div class="stat"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`
      ).join('');

      // plans
      const plans = [
        T.plans[0],
        { name: membership.name, price: '$5.99', period: '/mo', note: membership.monthly, features: membership.features, cta: membership.cta, interval: 'monthly', member: true },
        { name: membership.name, price: '$57.50', period: '/yr', note: membership.yearly, features: membership.features, cta: membership.cta, interval: 'yearly', popular: true, member: true },
      ];
      document.getElementById('plans-grid').innerHTML = plans.map((p) => {
        const features = p.features.map((f) => `<li>${escapeHtml(f)}</li>`).join('');
        const popular = p.popular ? '<span class="pop-badge">★</span>' : '';
        const isFree = p.price === '$0';
        const button = isFree
          ? `<a class="btn primary" href="${STORE_URL}" target="_blank" rel="noopener">${escapeHtml(p.cta)}</a>`
          : `<button class="btn checkout-btn" type="button" data-checkout="${p.interval}">${escapeHtml(p.cta)}</button>`;
        return `<article class="plan ${p.popular ? 'popular' : ''}">${popular}${p.member ? `<span class="tag pro">${escapeHtml(membership.badge)}</span>` : ''}<h3>${escapeHtml(p.name)}</h3>
          <div class="price"><b>${escapeHtml(p.price)}</b><span>${escapeHtml(p.period)}</span></div>
          <p class="note">${escapeHtml(p.note)}</p>
          <ul>${features}</ul>
          ${button}
        </article>`;
      }).join('');
      document.querySelectorAll('[data-checkout]').forEach((button) => {
        button.addEventListener('click', () => startMembershipCheckout(button.dataset.checkout));
      });

      // faq
      const faqs = T.faqs
        .map((item, index) => index === 1 ? [membership.faqQ, membership.faqA] : item)
        .filter(([question]) => !/(开源|source|open source|オープンソース|mã nguồn|오픈소스)/i.test(question));
      document.getElementById('faq-list').innerHTML = faqs.map(([q, a]) =>
        `<details class="faq-item"><summary>${escapeHtml(q)}</summary><div class="a">${escapeHtml(a)}</div></details>`
      ).join('');

      // installs
      document.getElementById('install-grid').innerHTML = T.installs
        .filter((it) => !/(github\.com|githubusercontent\.com)/i.test(it.url))
        .map((it) => {
          const url = it.name === 'Chrome Web Store' ? STORE_URL : it.url;
          return `<article class="card"><h3>${escapeHtml(it.name)}</h3><p>${escapeHtml(it.desc)}</p><a class="btn sm" href="${url}" target="_blank" rel="noopener">${escapeHtml(it.cta)}</a></article>`;
        }).join('');

      // update URL without reload
      if (params.get('lang') !== currentLang) {
        const url = new URL(window.location.href);
        if (currentLang === 'zh-CN') url.searchParams.delete('lang');
        else url.searchParams.set('lang', currentLang);
        window.history.replaceState(null, '', url);
      }
      store('xvm-lang', currentLang);
    }

    // ═══════════════════════════════════════════════════════════════
    // Interactions
    // ═══════════════════════════════════════════════════════════════
    // theme
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      store('xvm-theme', next);
    });

    document.getElementById('auth-button').addEventListener('click', () => {
      if (siteSession?.user) void signOutSite();
      else void startGoogleSignIn();
    });

    document.addEventListener('click', (event) => {
      if (event.target.closest('#retry-extension-sync')) void syncWebsiteLoginToExtension();
    });

    // language menu
    const langMenu = document.getElementById('lang-menu');
    const langToggle = document.getElementById('lang-toggle');
    langToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => langMenu.classList.remove('open'));
    document.getElementById('lang-dropdown').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-lang]');
      if (!btn) return;
      currentLang = btn.dataset.lang;
      applyLang();
      langMenu.classList.remove('open');
    });

    // mobile nav
    const burger = document.getElementById('burger');
    const mobileNav = document.getElementById('nav-mobile');
    burger.addEventListener('click', () => mobileNav.classList.toggle('open'));
    mobileNav.addEventListener('click', (e) => {
      if (e.target.closest('a')) mobileNav.classList.remove('open');
    });

    applyLang();
    void refreshSiteSession();
    const checkoutInterval = new URLSearchParams(location.search).get('checkout');
    if (checkoutInterval === 'monthly' || checkoutInterval === 'yearly') {
      const url = new URL(location.href);
      url.searchParams.delete('checkout');
      history.replaceState(null, '', url);
      startMembershipCheckout(checkoutInterval);
    }
  </script>
</body>
</html>
